<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c0e14">
    <title>Access denied · Slushie Control</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0c0e14;
            color: #eef0f7;
            font-synthesis: none;
            --surface: #141721;
            --border: #292e3d;
            --muted: #9da5ba;
        }
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-width: 320px;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            padding: 24px;
            background: radial-gradient(ellipse at 50% -25%, #292149 0, transparent 56%), #0c0e14;
        }
        .message-card {
            width: min(100%, 480px);
            padding: clamp(24px, 6vw, 40px);
            border: 1px solid var(--border);
            border-radius: 16px;
            background: linear-gradient(150deg, #191d29, var(--surface));
            box-shadow: 0 24px 70px #0005;
            text-align: center;
        }
        .brand-mark {
            display: grid;
            width: 44px;
            height: 44px;
            margin: 0 auto 22px;
            place-items: center;
            border: 1px solid #55427d;
            border-radius: 14px;
            background: linear-gradient(145deg, #a78bfa, #6d4cb4);
            color: white;
            font-size: 19px;
            font-weight: 800;
            box-shadow: 0 6px 24px #8b5cf633;
        }
        .http-status {
            display: inline-flex;
            padding: 6px 10px;
            border: 1px solid #694048;
            border-radius: 999px;
            background: #342126;
            color: #ffaaaa;
            font-size: 11px;
            font-weight: 750;
            letter-spacing: .06em;
        }
        h1 { margin: 17px 0 9px; font-size: clamp(22px, 5vw, 28px); letter-spacing: -.035em; }
        p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
        a { display: inline-block; margin-top: 24px; color: #c5b4ff; font-size: 13px; font-weight: 650; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="message-card" role="alert">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div class="http-status">HTTP 403</div>
        <h1>Access denied</h1>
        <p>{{MESSAGE}}</p>
        <a href="/logout">Sign in with another Discord account</a>
    </main>
</body>
</html>
