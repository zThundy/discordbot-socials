<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Ticket transcript</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
                background: #313338;
                color: #dbdee1;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                height: 100dvh;
                margin: 0;
            }

            body {
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .header {
                z-index: 1;
                display: flex;
                flex: 0 0 auto;
                align-items: center;
                gap: 12px;
                min-height: 60px;
                padding: 10px 20px;
                background: #313338;
                border-bottom: 1px solid #26272d;
                box-shadow: 0 1px 3px #1e1f2266;
            }

            .header-mark {
                display: grid;
                flex: 0 0 36px;
                width: 36px;
                height: 36px;
                place-items: center;
                overflow: hidden;
                border-radius: 50%;
                background: #232428;
            }

            .header-mark img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .header-copy {
                min-width: 0;
            }

            .channel-name {
                overflow: hidden;
                color: #f2f3f5;
                font-size: 16px;
                font-weight: 700;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .channel-name span {
                margin-right: 7px;
                color: #80848e;
                font-size: 20px;
                font-weight: 500;
            }

            .header-topic {
                overflow: hidden;
                margin-top: 2px;
                color: #949ba4;
                font-size: 12px;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .header-topic strong {
                color: #b5bac1;
                font-weight: 600;
            }

            .transcript-tag {
                flex: 0 0 auto;
                margin-left: auto;
                padding: 4px 8px;
                border: 1px solid #3f4147;
                border-radius: 4px;
                color: #b5bac1;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.06em;
            }

            body > .messages {
                flex: 1 1 auto;
                min-height: 0;
                overflow-x: hidden;
                overflow-y: auto;
                overscroll-behavior: contain;
                scrollbar-color: #1a1b1e #2b2d31;
                scrollbar-width: thin;
            }

            .messages > .messages {
                padding: 2px 0;
            }

            .message-container {
                display: flex;
                gap: 16px;
                margin: 0;
                padding: 2px 24px;
                border-radius: 0;
                transition: background-color 0.12s ease;
            }

            .message-container:hover {
                background: #2e3035;
            }

            .message-author-icon {
                flex: 0 0 40px;
                width: 40px;
                margin: 2px 0 0;
            }

            .message-author-icon img {
                display: block;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                object-fit: cover;
            }

            .message-content-container {
                min-width: 0;
                flex: 1 1 auto;
            }

            .message-author {
                display: flex;
                min-height: 22px;
                flex-wrap: wrap;
                align-items: baseline;
                gap: 0 8px;
                margin: 0;
                font-size: 16px;
                font-weight: 600;
                line-height: 22px;
            }

            .message-author-name:hover {
                text-decoration: underline;
                cursor: default;
            }

            .message-author-date {
                color: #949ba4;
                font-size: 12px;
                font-weight: 400;
            }

            .message-content {
                width: auto;
                margin: 2px 0 4px;
                color: #dbdee1;
                font-size: 15px;
                line-height: 1.375;
                overflow-wrap: anywhere;
                white-space: pre-wrap;
            }

            .message-content img {
                max-width: 100%;
                border-radius: 3px;
                vertical-align: middle;
            }

            .message-content a {
                color: #00a8fc;
                overflow-wrap: anywhere;
                text-decoration: none;
            }

            .message-content a:hover {
                text-decoration: underline;
            }

            .attachment {
                display: flex;
                width: fit-content;
                max-width: 100%;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                margin-top: 8px;
                padding: 12px;
                border: 1px solid #3f4147;
                border-radius: 8px;
                background: #2b2d31;
            }

            .attachment a {
                color: #00a8fc;
                font-size: 14px;
                overflow-wrap: anywhere;
                text-decoration: none;
            }

            .attachment a:hover {
                text-decoration: underline;
            }

            .attachment-preview {
                max-width: min(600px, 100%);
                max-height: 480px;
                border-radius: 4px;
                object-fit: contain;
            }

            .attachment audio {
                width: min(400px, 100%);
                max-width: 100%;
            }

            .attachment-size {
                color: #949ba4;
                font-size: 12px;
            }

            .footer {
                display: flex;
                flex: 0 0 auto;
                justify-content: center;
                padding: 10px 16px;
                border-top: 1px solid #26272d;
                background: #2b2d31;
                color: #949ba4;
                font-size: 12px;
            }

            .footer a {
                color: #00a8fc;
                text-decoration: none;
            }

            .footer a:hover {
                text-decoration: underline;
            }

            @media (max-width: 600px) {
                .header {
                    gap: 10px;
                    padding: 10px 14px;
                }

                .transcript-tag {
                    display: none;
                }

                .message-container {
                    gap: 12px;
                    padding-right: 14px;
                    padding-left: 14px;
                }

                .message-author-icon,
                .message-author-icon img {
                    flex-basis: 36px;
                    width: 36px;
                    height: 36px;
                }

                .message-content {
                    font-size: 14px;
                }
            }
        </style>
    </head>

    <body>
        <header class="header" id="myHeader">
            <div class="header-mark">
                <img src="{botProfilePicture}" alt="" />
            </div>
            <div class="header-copy">
                <div class="channel-name"><span>#</span>{channelName}</div>
                <div class="header-topic"><strong>{ticketTitle}</strong> — {ticketDescription}</div>
            </div>
            <span class="transcript-tag">TICKET TRANSCRIPT</span>
        </header>

        <div class="messages"></div>

        <footer class="footer">
            <span>Ticket transcript · Made with ❤️ by <a href="https://github.com/zThundy"><b>zThundy__</b></a></span>
        </footer>
    </body>
</html>
